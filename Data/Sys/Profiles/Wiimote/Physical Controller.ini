# "-" lives on the right stick click (R3), not on Options: Options is the MFi backend's name for
# PS Share/Create, Xbox View and Switch Pro "-", and the app routes that physical button to the
# pause menu (ControllerExtensions.swift installPauseMenuHandlers). Binding "-" there made one
# press do both. The right stick is otherwise unused by this Wii Remote + Nunchuk layout.
